[package]
name = "cuheft"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Per-kernel, per-architecture size and resource profiler for CUDA binaries"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/ZJY0516/cuheft"
keywords = ["cuda", "cubin", "bloat", "size", "profiler"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
bytesize = "2.7.0"
clap = { version = "4.6.7", features = ["derive"] }
comfy-table = "8.0.1"
cpp_demangle = "0.5.1"
env_logger = { version = "0.11.11", default-features = false }
log = { version = "0.4.34", default-features = false }
object = { version = "0.40.0", default-features = false, features = ["read_core", "elf", "std"] }
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
